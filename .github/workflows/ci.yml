name: CI

on:
  push:
    branches: [main, master, "fix/**", "test/**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  SOROBAN_NETWORK_PASSPHRASE: Test SDF Future Network ; October 2022

jobs:
  wasm-size-tests:
    name: WASM size gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test WASM size gate
        run: python3 -m unittest discover -s scripts -p 'test_check_wasm_size.py' -v

  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cargo check
        run: cargo check --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace --all-features

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none -p prediction_market

      # Initial project ceiling: 128 KiB (131072 bytes). Release settings use
      # opt-level=z, LTO and stripped symbols; this guard prevents unbounded
      # artifact growth. Revisit with measured headroom once main builds again;
      # this is a project budget, not an asserted Soroban network limit.
      - name: Enforce WASM size budget
        run: python3 scripts/check_wasm_size.py

  invariants:
    name: Cross-Contract Invariants
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install Stellar CLI
        run: |
          curl -sSfL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Run invariant tests
        run: cargo test -p cross_contract_invariants test_inv_ -- --nocapture
      - name: Run referral_registry tests
        run: cargo test -p referral_registry -- --nocapture
